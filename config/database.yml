# MySQL.  Versions 4.1 and 5.0 are recommended.
#
#
# Be sure to use new-style password hashing:
#   http://dev.mysql.com/doc/refman/5.0/en/old-client.html
default: &default
  adapter: mysql2
  # utf8mb4, not utf8: MySQL maps "utf8" to utf8mb3, which cannot hold 4-byte
  # characters. Every table here is already utf8mb4, so a utf8mb3 connection
  # silently rejected emoji (👍 🙏 🔥) coming in from WhatsApp. Production
  # already sets utf8mb4 below.
  encoding: utf8mb4
  pool: 5
  username: root
  password:
  host: 127.0.0.1
  port: 3306

development:
  <<: *default
  database: spinefitness_bckup5

# Warning: The database defined as "test" will be erased and
# re-generated from your development database when you run "rake".
# Do not set this db to the same as development or production.
test:
  <<: *default
  database: spinefitness_bckup5

production:
  adapter: mysql2
  encoding: utf8mb4
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  host: <%= ENV['MYSQL_ADDON_HOST'] %>
  port: <%= ENV['MYSQL_ADDON_PORT'] %>
  username: <%= ENV['MYSQL_ADDON_USER'] %>
  password: <%= ENV['MYSQL_ADDON_PASSWORD'] %>
  database: <%= ENV['MYSQL_ADDON_DB'] %>



